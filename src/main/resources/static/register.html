<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 · 五子棋对战</title>
    <link rel="icon" href="register.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 全局基础重置 + 柔光背景 */
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #f7f3e9 0%, #e8e0d5 100%);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 导航栏 */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 40px;
            background: rgba(30, 30, 35, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            color: #f5efe8;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            z-index: 999;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #b8a58b;
        }

        /* 主容器 register-container */
        .register-container {
            width: 100%;
            max-width: 500px;
            margin: 100px auto 40px;
            padding: 0 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        /* 注册卡片 register-dialog */
        .register-dialog {
            background: rgba(255, 250, 242, 0.92);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 48px 48px 48px 48px;
            padding: 3rem 2.5rem 2.8rem;
            width: 100%;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.25),
                0 8px 16px rgba(0, 0, 0, 0.1),
                inset 0 1px 4px rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 235, 210, 0.7);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .register-dialog:hover {
            box-shadow:
                0 28px 56px rgba(0, 0, 0, 0.28),
                0 10px 20px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        /* 标题 h3 */
        .register-dialog h3 {
            font-size: 2.4rem;
            font-weight: 600;
            color: #3d2c1e;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            position: relative;
        }

        .register-dialog h3::after {
            content: "";
            display: block;
            width: 70px;
            height: 4px;
            background: linear-gradient(90deg, #b8a58b, #dac09a);
            margin: 12px auto 0;
            border-radius: 4px;
        }

        /* 每一行 .row */
        .row {
            display: flex;
            align-items: center;
            margin-bottom: 1.6rem;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* 针对 .row 内 span 标签（用户名/密码） */
        .row span {
            width: 80px;
            font-weight: 500;
            color: #4d3a28;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        /* 输入框 */
        .row input[type="text"],
        .row input[type="password"] {
            flex: 1;
            min-width: 180px;
            padding: 14px 20px;
            border: 2px solid #e0d4c4;
            border-radius: 60px;
            background: #fcf9f5;
            font-size: 1rem;
            color: #2d241c;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.02);
            font-weight: 450;
        }

        .row input:focus {
            border-color: #b8a58b;
            background: #ffffff;
            box-shadow: 0 0 0 6px rgba(184, 165, 139, 0.2), inset 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .row input::placeholder {
            color: #b9aa99;
            font-weight: 300;
            opacity: 0.7;
        }

        /* 提交按钮 */
        #submit {
            width: 100%;
            padding: 16px 20px;
            background: #4d3a28;
            border: none;
            border-radius: 60px;
            color: #fcf3e7;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 0 #2f2218, 0 6px 14px rgba(0, 0, 0, 0.2);
            margin-top: 0.4rem;
            text-transform: uppercase;
        }

        #submit:hover {
            background: #5f4a35;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #2f2218, 0 10px 20px rgba(0, 0, 0, 0.25);
        }

        #submit:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #2f2218, 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .row:last-child {
            margin-bottom: 0;
            margin-top: 0.8rem;
        }

        /* 小屏优化 */
        @media (max-width: 520px) {
            .register-dialog {
                padding: 2.2rem 1.5rem 2rem;
                border-radius: 36px;
            }

            .row span {
                width: 70px;
                font-size: 1rem;
            }

            .row input[type="text"],
            .row input[type="password"] {
                min-width: 140px;
                padding: 12px 16px;
                font-size: 0.95rem;
            }

            .nav {
                font-size: 1.4rem;
                padding: 14px 24px;
            }

            .nav::before {
                font-size: 1.6rem;
            }

            .register-dialog h3 {
                font-size: 2rem;
            }

            #submit {
                font-size: 1.1rem;
                padding: 14px 16px;
            }
        }

        /* 极窄屏额外优化 */
        @media (max-width: 400px) {
            .row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .row span {
                width: auto;
                margin-bottom: 2px;
            }
        }

        /* 移除Bootstrap可能带来的多余边框或背景干扰 */
        .register-dialog,
        .register-container,
        .nav,
        body {
            background-origin: border-box;
        }

        /* 确保所有输入框无圆角异常 */
        input {
            border-radius: 60px !important;
        }

        /* 保留button原始类型，无冲突 */
        button#submit {
            box-sizing: border-box;
        }

        /* 额外小点缀 — 完全装饰性，不影响逻辑 */
        .register-dialog {
            position: relative;
            overflow: hidden;
        }

        .register-dialog::before {
            content: "⚫⚪";
            position: absolute;
            bottom: -20px;
            right: -10px;
            font-size: 8rem;
            opacity: 0.04;
            pointer-events: none;
            transform: rotate(12deg);
            letter-spacing: 20px;
            font-weight: 300;
            color: #3d2c1e;
        }

        /* 清除Bootstrap对按钮的默认样式干扰 */
        .btn,
        .btn-primary {
            background: none;
            border: none;
            box-shadow: none;
        }

        /* 移除Bootstrap对 .row 的默认负边距 */
        .row {
            margin-left: 0;
            margin-right: 0;
        }
    </style>
</head>

<body>

    <!-- 导航栏 .nav -->
    <div class="nav">
        网页五子棋对战
    </div>

    <!-- 注册容器 .register-container 原样 -->
    <div class="register-container">
        <!-- 注册对话框 .register-dialog 原样 -->
        <div class="register-dialog">
            <!-- 标题 h3 保留 -->
            <h3>注册</h3>
            <!-- 行：用户名 -->
            <div class="row">
                <span>用户名</span>
                <input type="text" id="username" placeholder="输入用户名">
            </div>
            <!-- 行：密码 -->
            <div class="row">
                <span>密码</span>
                <input type="password" id="password" placeholder="输入密码">
            </div>
            <!-- 行：提交按钮 -->
            <div class="row">
                <button id="submit">提交</button>
            </div>
            <div>
                已有帐号？<a href="login.html">登录</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/jquery-3.x-git.min.js"></script>
    <script>
        let usernameInput = document.querySelector('#username');
        let passwordInput = document.querySelector('#password');
        let submitButton = document.querySelector('#submit');
        //添加点击事件
        submitButton.onclick = function () {
            $.ajax({
                type: 'post',
                url: '/user/register',
                data: {
                    username: usernameInput.value,
                    password: passwordInput.value
                },
                success: function (body) {
                    //请求执行成功之后的回调函数
                    //判断当前是否注册成功
                    //如果注册成功就会返回当前的User对象
                    if (body && body.username) {
                        console.log("注册成功", body);
                        alert("注册成功! 欢迎" + body.username);
                        //注册成功跳转到对应的页面
                        location.href = "/login.html";
                    } else {
                        alert("注册失败!");
                    }
                },
                error: function () {
                    //请求执行失败之后的回调函数
                    alert("注册失败！请求执行失败");
                }
            });
        }
    </script>
</body>

</html>
